[package]
name = "rpgmad"
version = "7.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "WTFPL"
description = "Command-line tool for decrypting and encrypting RPG Maker `rgss` archives."
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["wrap_help", "derive"] }
encoding_rs = "0.8.42"
mimalloc = { version = "0.1.52", optional = true }
rpgmad-lib = { version = "7.0.0" }
walkdir = "2.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
codegen-units = 1
opt-level = 3
